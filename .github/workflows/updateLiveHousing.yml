name: Update Live Housing Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Download file from staging
        run: |
          curl -o 2026/04/02/housing-lottery/housing_output.json https://raw.githubusercontent.com/TheBDH/housing-lottery-test/refs/heads/main/housing_output.json

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add 2026/04/02/housing-lottery/housing_output.json
          
          if git diff-index --quiet HEAD; then
            echo "The file hasn't changed. Nothing to commit."
          else
            git commit -m "Data Desk: Pulled latest housing data from staging"
            git push
          fi